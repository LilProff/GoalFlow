services:
  - type: web
    name: goalflow-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # JWT_SECRET is generated by Render itself on first deploy — nothing
      # to paste in, and nobody (including us) ever sees the value.
      - key: JWT_SECRET
        generateValue: true
      # Everything below holds a real secret or an environment-specific
      # value (the deployed frontend's origin) — sync: false means Render
      # prompts for it once in the dashboard rather than storing it in this
      # committed file.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
